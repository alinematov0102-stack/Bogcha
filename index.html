<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2f8cff" />
    <title>Bog'cha</title>
    <style>
      :root {
        --b: #2f8cff;
        --bl: #eaf3ff;
        --t: #16253b;
        --g: #6b7a90;
        --r: #e5484d;
        --ok: #1fa971;
        --w: #fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font:
          16px system-ui,
          sans-serif;
        background: var(--bl);
        color: var(--t);
        padding-bottom: 90px;
        overflow-x: hidden;
      }
      body.lock {
        overflow: hidden;
      }
      button,
      .row,
      .chip {
        user-select: none;
        -webkit-user-select: none;
        cursor: pointer;
      }
      #app {
        max-width: 520px;
        margin: auto;
        padding: 16px;
      }
      h2 {
        margin: 6px 0;
      }
      h3 {
        margin: 18px 0 8px;
      }
      .mut {
        color: var(--g);
        font-size: 14px;
      }
      .c {
        text-align: center;
        margin: 20px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 12px 0;
      }
      .card {
        background: var(--w);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 2px 10px #2f8cff1a;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .grid .card {
        margin: 0;
      }
      .card span {
        color: var(--g);
        font-size: 13px;
      }
      .card b {
        font-size: 18px;
      }
      .card.ok b,
      .gr {
        color: var(--ok);
      }
      .card.bad b,
      .rd {
        color: var(--r);
      }
      .wide {
        background: linear-gradient(135deg, #2f8cff, #6db6ff);
      }
      .wide span {
        color: #ffffffcc;
      }
      .wide b {
        font-size: 24px;
        color: #fff;
      }
      .row {
        background: var(--w);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
      }
      .row > div:not(.av) {
        flex: 1;
        min-width: 0;
      }
      .row small {
        display: block;
        color: var(--g);
        font-size: 13px;
        margin-top: 2px;
      }
      .av {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--bl);
        color: var(--b);
        display: grid;
        place-items: center;
        font-weight: 700;
        flex: none;
        overflow: hidden;
        position: relative;
      }
      .av img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        display: block;
      }
      .profile-photo {
        display: block;
        width: 130px;
        height: 130px;
        object-fit: cover;
        object-position: center top;
        border-radius: 50%;
        margin: 10px auto;
        background: var(--bl);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 13px;
        border: 1.5px solid #d5e4f7;
        border-radius: 14px;
        font: inherit;
        font-size: 16px;
        background: #fff;
        margin: 4px 0 10px;
        color: var(--t);
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="file"] {
        padding: 10px;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 10px 0;
      }
      .bar input {
        margin: 0;
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 14px;
        background: var(--b);
        color: #fff;
        font: 600 16px system-ui;
        margin-top: 8px;
      }
      .btn.sm {
        width: auto;
        white-space: nowrap;
        padding: 12px 14px;
        margin: 0;
      }
      .btn.light {
        background: var(--bl);
        color: var(--b);
      }
      .btn.red {
        background: var(--r);
      }
      .btn:disabled {
        opacity: 0.6;
      }
      .pill {
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 12px;
        text-align: center;
      }
      .pill.tolangan {
        background: #e1f7ee;
        color: var(--ok);
      }
      .pill.qisman {
        background: #fff3d6;
        color: #b7791f;
      }
      .pill.tolanmagan {
        background: #ffe5e6;
        color: var(--r);
      }
      .tabs {
        display: flex;
        background: #fff;
        border-radius: 14px;
        padding: 4px;
        margin-bottom: 8px;
      }
      .tabs button {
        flex: 1;
        padding: 10px;
        border: 0;
        border-radius: 11px;
        background: none;
        font: 600 15px system-ui;
        color: var(--g);
      }
      .tabs .on {
        background: var(--b);
        color: #fff;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        display: none;
        padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -4px 18px #2f8cff22;
        z-index: 5;
      }
      nav button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--g);
        font: 600 11px system-ui;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px;
      }
      nav b {
        font-size: 22px;
      }
      nav .on {
        color: var(--b);
      }
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        background: #0007;
        z-index: 10;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: #fff;
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 24px 24px 0 0;
        padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
        position: relative;
      }
      .sheet label {
        display: block;
        font-size: 13px;
        color: var(--g);
        margin-top: 6px;
      }
      .sheet p {
        margin: 6px 0;
      }
      .sheet .row {
        box-shadow: 0 0 0 1px #e3eefb;
      }
      .x {
        position: absolute;
        right: 14px;
        top: 12px;
        border: 0;
        background: var(--bl);
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      #toast {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translate(-50%, -120px);
        background: var(--t);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        z-index: 20;
        transition: 0.3s;
        max-width: 90%;
      }
      #toast.show {
        transform: translate(-50%, 0);
      }
      .login {
        max-width: 360px;
        margin: 12vh auto 0;
        text-align: center;
      }
      .logo {
        font-size: 64px;
      }
      .chips {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .chip {
        flex: 1;
        padding: 9px 2px;
        border: 1.5px solid #d5e4f7;
        border-radius: 12px;
        background: #fff;
        font: 600 12px system-ui;
        color: var(--g);
      }
      .s_keldi {
        background: var(--ok);
        color: #fff;
        border-color: var(--ok);
      }
      .s_kelmadi {
        background: var(--r);
        color: #fff;
        border-color: var(--r);
      }
      .s_sababli {
        background: #f0a020;
        color: #fff;
        border-color: #f0a020;
      }
      .s_sababsiz {
        background: #7b5cd6;
        color: #fff;
        border-color: #7b5cd6;
      }
      .back {
        border: 0;
        background: none;
        color: var(--b);
        font: 600 16px system-ui;
        margin-bottom: 6px;
      }
      .card.chart {
        flex-direction: row;
        align-items: flex-end;
        height: 150px;
        gap: 8px;
      }
      .col {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .bars {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: flex-end;
        gap: 3px;
      }
      .bars i {
        flex: 1;
        border-radius: 4px 4px 0 0;
        min-height: 2px;
      }
      .dt {
        display: inline-block;
        background: var(--bl);
        color: var(--b);
        border-radius: 8px;
        padding: 1px 7px;
        font-size: 12px;
        font-weight: 600;
      }
      @media print {
        nav,
        .noprint,
        .back {
          display: none !important;
        }
        body {
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <nav></nav>
    <div id="modal"></div>
    <div id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script>
      /* ====== SOZLAMA ====== */
      const SB_URL = "https://csbpoxykhgfkzgxabnty.supabase.co";
      const SB_KEY = "sb_publishable_9FJvqjmyJS8N2tbuoLBdCg_F103ygXX";
      /* ===================== */
      const sb = supabase.createClient(SB_URL, SB_KEY);
      const $ = (s) => document.querySelector(s);
      const E = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const M = (n) => Number(n || 0).toLocaleString("ru-RU") + " so'm";
      const D = () =>
          new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tashkent" }),
        MO = () => D().slice(0, 7);
      const FD = (s) => {
        const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
        return m ? m[3] + "." + m[2] + "." + m[1] : s || "—";
      };
      const DT = (s) => '<span class="dt">' + FD(s) + "</span>";
      const PHOTO_BUCKET = "bolalar-rasmlari";
      const nxt = (m) => {
        const d = new Date(m + "-01T00:00:00Z");
        d.setUTCMonth(d.getUTCMonth() + 1);
        return d.toISOString().slice(0, 10);
      };
      const USUL = { naqd: "Naqd", karta: "Karta", otkazma: "O‘tkazma" };
      let me,
        tab = "bosh",
        sub = "",
        sq = "",
        tm = MO(),
        tf = "hamma",
        mm = MO(),
        dd = D(),
        hm = MO();
      const can = (p) =>
        me && (me.rol === "admin" || (me.ruxsatlar || []).includes(p));
      const toast = (m) => {
        const t = $("#toast");
        t.textContent = m;
        t.className = "show";
        setTimeout(() => (t.className = ""), 3500);
      };
      async function q(p) {
        const r = await p;
        if (r.error) {
          toast(r.error.message);
          throw r.error;
        }
        return r.data;
      }
      const sheet = (h) => {
        $("#modal").innerHTML =
          '<div class="sheet"><button class="x" onclick="shut()">✕</button>' +
          h +
          "</div>";
        $("#modal").style.display = "flex";
        document.body.classList.add("lock");
      };
      const shut = () => {
        $("#modal").style.display = "none";
        document.body.classList.remove("lock");
      };
      const back =
        '<button class="back noprint" onclick="sub=\'\';render()">← Orqaga</button>';

      /* ---------- Rasm yordamchilari ---------- */
      const shrink = (f) =>
        new Promise((res) => {
          const i = new Image(),
            u = URL.createObjectURL(f);
          i.onload = () => {
            const k = Math.min(1, 900 / Math.max(i.width, i.height)),
              c = document.createElement("canvas");
            c.width = Math.round(i.width * k);
            c.height = Math.round(i.height * k);
            c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
            URL.revokeObjectURL(u);
            c.toBlob((b) => res(b || f), "image/jpeg", 0.85);
          };
          i.onerror = () => res(f);
          i.src = u;
        });
      async function signedPhoto(path) {
        if (!path) return "";
        const { data, error } = await sb.storage
          .from(PHOTO_BUCKET)
          .createSignedUrl(path, 3600);
        return error ? "" : data?.signedUrl || "";
      }
      async function signedMany(list) {
        const paths = list.map((b) => b.rasm_path).filter(Boolean);
        if (!paths.length) return;
        const { data } = await sb.storage
          .from(PHOTO_BUCKET)
          .createSignedUrls(paths, 3600);
        const mp = {};
        (data || []).forEach((x) => x.signedUrl && (mp[x.path] = x.signedUrl));
        list.forEach((b) => (b._photoUrl = mp[b.rasm_path] || ""));
      }
      function previewPhoto(input) {
        const file = input.files?.[0];
        if (!file) return;
        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
          input.value = "";
          return toast("JPG, PNG yoki WebP rasm tanlang");
        }
        if (file.size > 10 * 1024 * 1024) {
          input.value = "";
          return toast("Rasm hajmi 10 MB dan oshmasin");
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = $("#photo-preview");
          if (img) {
            img.src = reader.result;
            img.style.display = "block";
          }
        };
        reader.readAsDataURL(file);
      }
      async function saveChildPhoto(id, file, oldPath) {
        if (!file) return oldPath || null;
        const blob = await shrink(file);
        const path =
          String(id) +
          "/" +
          Date.now().toString(36) +
          "-" +
          Math.random().toString(36).slice(2) +
          ".jpg";
        const bucket = sb.storage.from(PHOTO_BUCKET);
        const { error: ue } = await bucket.upload(path, blob, {
          contentType: "image/jpeg",
          cacheControl: "3600",
          upsert: false,
        });
        if (ue) {
          toast("Rasm saqlanmadi. Supabase foto SQL sozlamasini bajaring.");
          throw ue;
        }
        const { error: pe } = await sb
          .from("bolalar")
          .update({ rasm_path: path })
          .eq("id", id);
        if (pe) {
          await bucket.remove([path]);
          toast("rasm_path ustuni yo‘q. Supabase SQL sozlamasini bajaring.");
          throw pe;
        }
        if (oldPath && oldPath !== path) await bucket.remove([oldPath]);
        return path;
      }

      /* ---------- Umumiy forma ---------- */
      function form(title, fields, v, save, del, ex) {
        window._save = save;
        window._del = del;
        window._f = fields;
        sheet(
          "<h3>" +
            title +
            "</h3>" +
            (ex || "") +
            fields
              .map((f) => {
                const val = v?.[f.k] ?? f.d ?? "",
                  id = "f_" + f.k;
                const i =
                  f.t === "file"
                    ? '<input id="' +
                      id +
                      '" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(this)"><img id="photo-preview" class="profile-photo" alt="Bola rasmi" src="' +
                      E(window._photoPreview || "") +
                      '" style="' +
                      (window._photoPreview ? "" : "display:none") +
                      '">'
                    : f.t === "select"
                      ? '<select id="' +
                        id +
                        '">' +
                        f.o
                          .map(
                            (o) =>
                              '<option value="' +
                              E(o[0]) +
                              '"' +
                              (String(o[0]) === String(val)
                                ? " selected"
                                : "") +
                              ">" +
                              E(o[1]) +
                              "</option>",
                          )
                          .join("") +
                        "</select>"
                      : f.t === "area"
                        ? '<textarea id="' +
                          id +
                          '" rows="3">' +
                          E(val) +
                          "</textarea>"
                        : '<input id="' +
                          id +
                          '" type="' +
                          (f.t || "text") +
                          '" value="' +
                          E(val) +
                          '"' +
                          (f.t === "number" ? ' inputmode="decimal"' : "") +
                          ">";
                return "<label>" + f.l + (f.r ? " *" : "") + i + "</label>";
              })
              .join("") +
            '<button class="btn" id="sv" onclick="sendForm()">Saqlash</button>' +
            (del
              ? '<button class="btn red" onclick="delForm()">O‘chirish</button>'
              : ""),
        );
      }
      async function sendForm() {
        const o = {};
        for (const f of window._f) {
          if (f.t === "file") continue;
          const x = $("#f_" + f.k).value.trim();
          o[f.k] = x === "" ? null : f.t === "number" ? Number(x) : x;
          if (f.r && o[f.k] === null)
            return toast("“" + f.l + "” to‘ldirilishi shart");
        }
        const btn = $("#sv");
        btn.disabled = true;
        try {
          const pf = window._f.find((f) => f.t === "file");
          const photo = pf ? $("#f_" + pf.k).files?.[0] || null : null;
          await window._save(o, photo);
          shut();
          render();
        } catch (e) {
          btn.disabled = false;
        }
      }
      async function delForm() {
        if (!confirm("Rostdan o‘chirasizmi?")) return;
        try {
          await window._del();
          shut();
          render();
        } catch (e) {}
      }

      /* ---------- Kirish ---------- */
      function loginView() {
        $("nav").style.display = "none";
        $("#app").innerHTML =
          '<div class="login"><div class="logo">🧸</div><h1>Bog‘cha</h1><p class="mut">Boshqaruv tizimi</p><br><input id="lg" placeholder="Login" autocapitalize="none" autocomplete="username"><input id="ps" type="password" placeholder="Parol" autocomplete="current-password"><button class="btn" onclick="login()">Kirish</button></div>';
      }
      async function login() {
        let u = $("#lg").value.trim();
        if (!u.includes("@")) u += "@bogcha.uz";
        const { error } = await sb.auth.signInWithPassword({
          email: u,
          password: $("#ps").value,
        });
        if (error) return toast("Login yoki parol noto‘g‘ri");
        start();
      }
      async function start() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (!session) return loginView();
        const { data } = await sb
          .from("profillar")
          .select("*")
          .eq("id", session.user.id)
          .single();
        if (!data || !data.faol) {
          await sb.auth.signOut();
          toast("Hisob faol emas");
          return loginView();
        }
        me = data;
        $("nav").style.display = "flex";
        render();
      }
      const logout = async () => {
        await sb.auth.signOut();
        me = null;
        loginView();
      };
      function parol() {
        form(
          "Parolni almashtirish",
          [{ k: "p", l: "Yangi parol (kamida 6 belgi)", t: "password", r: 1 }],
          {},
          async (o) => {
            if (o.p.length < 6) {
              toast("Parol juda qisqa");
              throw 0;
            }
            const { error } = await sb.auth.updateUser({ password: o.p });
            if (error) {
              toast(error.message);
              throw error;
            }
            toast("Parol almashtirildi");
          },
        );
      }

      /* ---------- Navigatsiya ---------- */
      function navHtml() {
        const t = [
          ["bosh", "🏠", "Bosh"],
          ["bolalar", "👶", "Bolalar"],
          ["tolov", "💳", "To‘lov"],
          ["moliya", "📊", "Moliya"],
          ["yana", "☰", "Yana"],
        ];
        $("nav").innerHTML = t
          .filter((x) =>
            x[0] === "tolov"
              ? can("tolovlar")
              : x[0] === "moliya"
                ? can("kirim_chiqim")
                : 1,
          )
          .map(
            (x) =>
              '<button class="' +
              (tab === x[0] ? "on" : "") +
              '" onclick="go(\'' +
              x[0] +
              "')\"><b>" +
              x[1] +
              "</b>" +
              x[2] +
              "</button>",
          )
          .join("");
      }
      const go = (t) => {
        tab = t;
        sub = "";
        scrollTo(0, 0);
        render();
      };
      async function render() {
        navHtml();
        const a = $("#app");
        if (!a.innerHTML) a.innerHTML = '<p class="mut c">Yuklanmoqda…</p>';
        try {
          const v = { bosh, bolalar, tolov, moliya, yana }[tab];
          a.innerHTML = await v();
        } catch (e) {
          a.innerHTML =
            '<p class="mut c">Xatolik yuz berdi. Qayta urinib ko‘ring.</p>';
        }
      }

      /* ---------- Bosh sahifa ---------- */
      async function bosh() {
        const s = await q(sb.rpc("dashboard_statistika"));
        const m = await q(
          sb
            .from("kirim_chiqim_oylik")
            .select("*")
            .order("oy", { ascending: false })
            .limit(6),
        );
        const mx = Math.max(1, ...m.map((x) => Math.max(+x.kirim, +x.chiqim)));
        const c = (l, v, k) =>
          '<div class="card ' +
          (k || "") +
          '"><span>' +
          l +
          "</span><b>" +
          v +
          "</b></div>";
        return (
          "<h2>Salom, " +
          E(me.ism || "") +
          ' 👋</h2><p class="mut">Bugun: ' +
          FD(D()) +
          '</p><div class="grid">' +
          c("Jami bolalar", s.jami_bolalar) +
          c("Bugun kelgan", s.bugun_kelgan, "ok") +
          c("Bugun kelmagan", s.bugun_kelmagan, "bad") +
          c("To‘lov qilganlar", s.tolov_qilganlar, "ok") +

      /* ---------- Oylik to'lovlar ---------- */
      async function tolov() {
        const r =
          tf === "qarz"
            ? await q(
                sb
                  .from("qarzdorlar")
                  .select("*")
                  .order("kechikkan_kun", { ascending: false }),
              )
            : await q(
                sb
                  .from("oylik_hisoblar")
                  .select("*,bolalar(ism,familiya)")
                  .eq("oy", tm + "-01")
                  .order("created_at"),
              );
        const ids = r.map((x) => x.hisob_id || x.id).filter(Boolean);
        const pays = ids.length
          ? await q(
              sb
                .from("tolovlar")
                .select("id,hisob_id,sana,summa,usul")
                .in("hisob_id", ids)
                .order("sana", { ascending: false }),
            )
          : [];
        const pm = {};
        pays.forEach((p) => (pm[p.hisob_id] = pm[p.hisob_id] || []).push(p));
        window._h = r.map((x) => ({
          ...x,
          _pays: pm[x.hisob_id || x.id] || [],
        }));
        const nm = (x) =>
            x.bolalar
              ? x.bolalar.familiya + " " + x.bolalar.ism
              : x.familiya + " " + x.ism,
          T = {
            tolangan: "To‘langan",
            qisman: "Qisman",
            tolanmagan: "To‘lanmagan",
          };
        return (
          '<div class="tabs"><button class="' +
          (tf === "hamma" ? "on" : "") +
          '" onclick="tf=\'hamma\';render()">Oylik</button><button class="' +
          (tf === "qarz" ? "on" : "") +
          '" onclick="tf=\'qarz\';render()">Qarzdorlar</button></div>' +
          (tf === "hamma"
            ? '<div class="bar"><input type="month" value="' +
              tm +
              '" onchange="tm=this.value||tm;render()"><button class="btn sm" onclick="mk()">Hisob yaratish</button></div>'
            : "") +
          (window._h
            .map(
              (x) =>
                '<div class="row" onclick="pay(\'' +
                (x.hisob_id || x.id) +
                "')\"><div><b>" +
                E(nm(x)) +
                "</b><small>" +
                x.oy.slice(0, 7) +
                " · " +
                M(x.tolangan) +
                " / " +
                M(x.summa) +
                "</small>" +
                (x.muddat
                  ? "<small>Muddat: " +
                    FD(x.muddat) +
                    (x.kechikkan_kun > 0
                      ? " · " + x.kechikkan_kun + " kun kechikkan"
                      : "") +
                    "</small>"
                  : "") +
                (x._pays.length
                  ? "<small>Oxirgi to‘lov: " +
                    DT(x._pays[0].sana) +
                    (x._pays.length > 1
                      ? " · jami " + x._pays.length + " marta"
                      : "") +
                    "</small>"
                  : "<small>Hali to‘lov qilinmagan</small>") +
                '</div><span class="pill ' +
                x.holat +
                '">' +
                T[x.holat] +
                (x.holat !== "tolangan" ? "<br>" + M(x.qarz) : "") +
                "</span></div>",
            )
            .join("") ||
            '<p class="mut c">Ma’lumot yo‘q. “Hisob yaratish” tugmasi shu oy uchun barcha bolalarga hisob ochadi.</p>')
        );
      }

      /* ---------- Kirim-chiqim ---------- */
      const KK = {
        kirim: [
          ["oylik_tolov", "Oylik to‘lov"],
          ["qoshimcha_tolov", "Qo‘shimcha to‘lov"],
          ["boshqa_daromad", "Boshqa daromad"],
        ],
        chiqim: [
          ["oziq_ovqat", "Oziq-ovqat"],
          ["xodimlar_oyligi", "Xodimlar oyligi"],
          ["kommunal", "Kommunal to‘lovlar"],
          ["oyinchoq_jihoz", "O‘yinchoq va jihozlar"],
          ["boshqa_xarajat", "Boshqa xarajat"],
        ],
      };
      async function moliya() {
        const r = await q(
          sb
            .from("kirim_chiqim")
            .select("*")
            .gte("sana", mm + "-01")
            .lt("sana", nxt(mm))
            .order("sana", { ascending: false })
            .order("created_at", { ascending: false }),
        );
        const ids = [...new Set(r.map((x) => x.tolov_id).filter(Boolean))];
        const [monthPays, linked] = await Promise.all([
          q(
            sb
              .from("tolovlar")
              .select("id,sana,summa,bolalar(ism,familiya)")
              .gte("sana", mm + "-01")
              .lt("sana", nxt(mm)),
          ),
          ids.length
            ? q(
                sb
                  .from("tolovlar")
                  .select("id,sana,summa,bolalar(ism,familiya)")
                  .in("id", ids),
              )
            : [],
        ]);
        const byId = {};
        [...monthPays, ...linked].forEach((p) => (byId[p.id] = p));
        const used = new Set(ids);
        const free = monthPays.filter((p) => !used.has(p.id));
        window._k = r.map((x) => {
          let p = x.tolov_id ? byId[x.tolov_id] : null;
          if (!p && x.tur === "kirim" && x.kategoriya === "oylik_tolov") {
            const i = free.findIndex(
              (f) => f.sana === x.sana && Number(f.summa) === Number(x.summa),
            );
            if (i >= 0) p = free.splice(i, 1)[0];
          }
          return { ...x, _payment: p || null };
        });
        const sm = (t) =>
            r.filter((x) => x.tur === t).reduce((a, x) => a + +x.summa, 0),
          ki = sm("kirim"),
          ch = sm("chiqim");
        const lb = Object.fromEntries([...KK.kirim, ...KK.chiqim]);
        return (
          '<div class="bar"><input type="month" value="' +
          mm +
          '" onchange="mm=this.value||mm;render()"></div><div class="grid"><div class="card ok"><span>Kirim</span><b>' +
          M(ki) +
          '</b></div><div class="card bad"><span>Chiqim</span><b>' +
          M(ch) +
          "</b></div></div>" +
          '<div class="card wide"><span>Sof foyda</span><b>' +
          M(ki - ch) +
          '</b></div><div class="bar"><button class="btn sm" onclick="kc(\'kirim\')">+ Kirim</button><button class="btn sm red" onclick="kc(\'chiqim\')">− Chiqim</button></div>' +
          (window._k
            .map((x) => {
              const b = x._payment?.bolalar;
              return (
                '<div class="row" onclick="kd(\'' +
                x.id +
                "')\"><div><b>" +
                (b ? "👶 " + E(b.familiya + " " + b.ism) : lb[x.kategoriya]) +
                "</b><small>" +
                (b ? lb[x.kategoriya] + " · " : "") +
                "Sana: " +
                DT(x.sana) +
                "</small>" +
                (x._payment?.sana
                  ? "<small>To‘lov sanasi: " + DT(x._payment.sana) + "</small>"
                  : "") +
                (x.izoh ? "<small>" + E(x.izoh) + "</small>" : "") +
                '</div><b class="' +
                (x.tur === "kirim" ? "gr" : "rd") +
                '">' +
                (x.tur === "kirim" ? "+" : "−") +
                M(x.summa) +
                "</b></div>"
              );
            })
            .join("") || '<p class="mut c">Operatsiya yo‘q</p>')
        );
      }
      function kc(t) {
        form(
          t === "kirim" ? "Yangi kirim" : "Yangi chiqim",
          [
            { k: "kategoriya", l: "Kategoriya", t: "select", o: KK[t] },
            { k: "sana", l: "Sana", t: "date", d: D(), r: 1 },
            { k: "summa", l: "Summa (so‘m)", t: "number", r: 1 },
            { k: "izoh", l: "Izoh" },
          ],
          {},
          (o) => q(sb.from("kirim_chiqim").insert({ ...o, tur: t })),
        );

      function kd(id) {
        const x = window._k.find((y) => y.id === id);
        if (x.tolov_id)
          return toast("Bu kirim bola to‘lovidan avtomatik yozilgan");

              .select("id,ism,familiya,rasm_path")
              .eq("faol", true)
              .order("familiya"),
          ),
          q(sb.from("davomat").select("bola_id,holat").eq("sana", dd)),
        ]);
        await signedMany(b);
        const mp = Object.fromEntries(r.map((x) => [x.bola_id, x.holat])),
          H = [
            ["keldi", "Keldi"],
            ["kelmadi", "Kelmadi"],
            ["sababli", "Sababli"],
            ["sababsiz", "Sababsiz"],
          ];
        return (
          back +
          '<h2>Davomat</h2><p class="mut">Sana: ' +
          FD(dd) +

          dd +
          '" onchange="dd=this.value||dd;render()"></div>' +
          b
            .map(

                avatar(x) +

                    h[1] +
                    "</button>",

                "</div></div>",
            )
            .join("")
        );

      async function hisobot() {
        const a = hm + "-01",
          z = nxt(hm);
        const [bs, ty, kk, qd, dv, gr, ks] = await Promise.all([
          q(sb.from("bolalar").select("faol,kelgan_sana,ketgan_sana")),
          q(sb.from("tolovlar_oylik").select("*").eq("oy", a)),
          q(sb.from("kirim_chiqim_oylik").select("*").eq("oy", a)),
          q(
            sb
              .from("qarzdorlar")
              .select("*")
              .order("kechikkan_kun", { ascending: false }),
          ),
          q(
            sb
              .from("davomat_oylik")
              .select("keldi,kelmadi,sababli,sababsiz")
              .eq("oy", a),
          ),
          q(sb.from("guruhlar_royxati").select("*").order("nomi")),
          q(
            sb
              .from("tolovlar")
              .select("*,bolalar(ism,familiya)")
              .gte("sana", a)
              .lt("sana", z)
              .order("sana"),
          ),
        ]);
        const S = (k) => dv.reduce((s, x) => s + Number(x[k]), 0),
          t = ty[0] || {},
          c = kk[0] || {};
        window._r = { qd, ks };
        const R = (l, v) =>
          '<div class="row"><b>' + l + "</b><span>" + v + "</span></div>";
        return (
          back +
          '<h2>Hisobotlar</h2><p class="mut">Davr: ' +
          FD(a) +
          " — " +
          FD(new Date(new Date(z).getTime() - 864e5).toISOString()) +
          '</p><div class="bar"><input type="month" value="' +
          hm +
          '" onchange="hm=this.value||hm;render()"></div>' +
          '<div class="bar noprint"><button class="btn sm" onclick="print()">PDF</button><button class="btn sm light" onclick="csv(\'qarz\')">Excel: qarzdorlar</button><button class="btn sm light" onclick="csv(\'tolov\')">Excel: to‘lovlar</button></div>' +
          "<h3>Bolalar</h3>" +
          R("Jami faol bolalar", bs.filter((x) => x.faol).length) +
          R(
            "Yangi kelganlar",
            bs.filter((x) => x.kelgan_sana >= a && x.kelgan_sana < z).length,
          ) +
          R(
            "Ketganlar",
            bs.filter(
              (x) => x.ketgan_sana && x.ketgan_sana >= a && x.ketgan_sana < z,
            ).length,
          ) +
          "<h3>Oylik to‘lovlar</h3>" +
          R("Rejadagi summa", M(t.rejadagi_summa)) +
          R("Yig‘ilgan", M(t.yigilgan_summa)) +
          R("Qolgan qarz", M(t.qolgan_qarz)) +
          R(
            "To‘langan / qisman / to‘lanmagan",
            (t.tolangan_soni || 0) +
              " / " +
              (t.qisman_soni || 0) +
              " / " +
              (t.tolanmagan_soni || 0),
          ) +
          "<h3>Shu oydagi to‘lovlar (" +
          ks.length +
          ")</h3>" +
          (ks
            .map((x) =>
              R(
                E(x.bolalar.familiya + " " + x.bolalar.ism) +
                  " <small>" +
                  FD(x.sana) +
                  "</small>",
                M(x.summa),
              ),
            )
            .join("") || '<p class="mut">To‘lov yo‘q</p>') +
          "<h3>Kirim-chiqim</h3>" +
          R("Kirim", M(c.kirim)) +
          R("Chiqim", M(c.chiqim)) +
          R("Sof foyda", M(c.sof_foyda)) +
          "<h3>Davomat</h3>" +
          R("Keldi", S("keldi")) +
          R("Kelmadi", S("kelmadi")) +
          R("Sababli", S("sababli")) +
          R("Sababsiz", S("sababsiz")) +
          "<h3>Guruhlar</h3>" +
          gr.map((x) => R(E(x.nomi), x.bolalar_soni + " ta bola")).join("") +
          "<h3>Qarzdorlar (" +
          qd.length +
          ")</h3>" +
          qd
            .map((x) =>
              R(
                E(x.familiya + " " + x.ism) +
                  " <small>" +
                  x.oy.slice(0, 7) +
                  (x.muddat ? " · muddat " + FD(x.muddat) : "") +
                  "</small>",
                M(x.qarz),
              ),
            )
            .join("")
        );
      }
      function csv(k) {
        const { qd, ks } = window._r;
        const rows =
          k === "qarz"
            ? [
                [
                  "Bola",
                  "Telefon",
                  "Oy",
                  "Summa",
                  "Tolangan",
                  "Qarz",
                  "Muddat",
                ],
              ].concat(
                qd.map((x) => [
                  x.familiya + " " + x.ism,
                  x.telefon || "",
                  x.oy.slice(0, 7),
                  x.summa,
                  x.tolangan,
                  x.qarz,
                  FD(x.muddat),
                ]),
              )
            : [["Sana", "Bola", "Summa", "Usul"]].concat(
                ks.map((x) => [
                  FD(x.sana),
                  x.bolalar.familiya + " " + x.bolalar.ism,
                  x.summa,
                  USUL[x.usul] || x.usul,
                ]),
              );
        const t =
          "\ufeff" +
          rows
            .map((r) =>
              r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";"),
            )
            .join("\n");
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" }));
        a.download =
          (k === "qarz" ? "qarzdorlar" : "tolovlar") + "_" + hm + ".csv";
        a.click();
      }

      /* iPhone'da ikki marta bosganda kattalashishni o'chirish */
      let lt = 0;
      document.addEventListener(
        "touchend",
        (e) => {
          const n = Date.now();
          if (
            n - lt < 350 &&
            !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)
          )
            e.preventDefault();
          lt = n;
        },
        { passive: false },
      );
      document.addEventListener("gesturestart", (e) => e.preventDefault());

      start();
    </script>
  </body>
</html>
